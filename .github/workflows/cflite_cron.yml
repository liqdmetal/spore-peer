name: ClusterFuzzLite cron tasks

# Rust half of the cross-binary decoder fuzzing (mirrors spore's
# cflite_cron.yml). Housekeeping required by the batch workflow
# (ClusterFuzzLite docs: batch fuzzing must be paired with pruning — an
# unpruned corpus grows without bound and slows every subsequent batch run).
#
# Storage: same-repo branches per the docs' "Git repo for storage" section
# — prune writes the minimized corpus back to cfl-corpus, coverage publishes
# reports to gh-pages (viewable at
# https://liqdmetal.github.io/spore-peer/coverage/latest/report/linux/report.html).
# No PAT: the storage repo is this workflow's own repo, so the default
# token's contents: write covers both jobs with exactly one repo's scope.
#
# Schedule offset from spore's 08:00 UTC cron so the two repos' nightly
# housekeeping never collide.

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch: {}

permissions:
  # contents: write — prune pushes the minimized corpus to cfl-corpus and
  # coverage publishes reports to gh-pages. Scoped to this repo only.
  contents: write

jobs:
  Pruning:
    runs-on: ubuntu-latest
    steps:
    - name: Build Fuzzers
      id: build
      uses: google/clusterfuzzlite/actions/build_fuzzers@v1
      with:
        language: rust

    - name: Run Fuzzers (prune)
      id: run
      uses: google/clusterfuzzlite/actions/run_fuzzers@v1
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        fuzz-seconds: 600
        mode: 'prune'
        storage-repo: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/liqdmetal/spore-peer.git
        storage-repo-branch: cfl-corpus

  Coverage:
    # The report producer: publishes to gh-pages so the report is viewable
    # on the web instead of riding 90-day artifacts. Runs after the day's
    # batch so the report reflects a full corpus.
    runs-on: ubuntu-latest
    steps:
    - name: Build Fuzzers (coverage)
      id: build
      uses: google/clusterfuzzlite/actions/build_fuzzers@v1
      with:
        language: rust
        sanitizer: coverage

    - name: Run Fuzzers (coverage)
      id: run
      uses: google/clusterfuzzlite/actions/run_fuzzers@v1
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        fuzz-seconds: 600
        mode: 'coverage'
        sanitizer: 'coverage'
        # run_fuzzers carries its own language input (it does not inherit
        # build_fuzzers'). The coverage script's default c++ path happens to
        # work for libfuzzer-sys binaries — they export LLVMFuzzerTestOneInput
        # — but rust is the honest input and keeps the report keyed to the
        # right toolchain behavior.
        language: rust
        storage-repo: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/liqdmetal/spore-peer.git
        storage-repo-branch: cfl-corpus
        # storage-repo-branch-coverage defaults to gh-pages — named here so
        # the publish target is explicit, not implicit.
        storage-repo-branch-coverage: gh-pages
