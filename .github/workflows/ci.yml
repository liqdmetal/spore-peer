name: CI

on:
  # Push runs only on main: a bare push trigger fires on every commit twice
  # (push + PR event), which burns private-repo Actions minutes.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded PR runs (same branch, newer commit) instead of letting
# stale runs grind to completion.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --locked
      - name: Test
        # Cargo.lock is tracked; --locked keeps CI on the exact dependency
        # graph the wire-protocol conformance tests were validated against.
        run: cargo test --locked

  clippy:
    name: clippy (-D warnings gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy (--no-deps, deny warnings)
        # Blocking since the backlog was drained (2026-09-09): the rpc2/CBOR
        # port in p2p.rs is intentionally kept whole behind a module-scoped
        # allow(dead_code) until the sync loop consumes it — the lint gate
        # must not pressure anyone into sawing the protocol in half.
        run: cargo clippy --workspace --all-targets --no-deps -- -D warnings
