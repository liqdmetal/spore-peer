[package]
name = "mycelium-peer"
version = "0.1.0"
edition = "2021"
description = "mycelium-peer (m3) — P2P long-body transport for Mycelium, the no-relay multi-chain messenger. Clean-room BSD-3. Serves and fetches ECDH-encrypted bodies by CID with sha256 integrity."
license = "BSD-3-Clause"

[dependencies]
serde_json = "1"
hex = "0.4"
sha2 = "0.10"

[[bin]]
name = "mycelium-peer"
path = "src/mycelium_peer.rs"
