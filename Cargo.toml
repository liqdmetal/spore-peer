[package]
name = "compost-peer"
version = "0.1.0"
edition = "2021"
description = "compost-peer — P2P long-body transport for Compost (the no-relay DERO messenger). Clean-room BSD-3. Serves and fetches ECDH-encrypted bodies by CID with sha256 integrity."
license = "BSD-3-Clause"

[dependencies]
serde_json = "1"
hex = "0.4"
sha2 = "0.10"

[[bin]]
name = "compost-peer"
path = "src/compost_peer.rs"
